[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snippen-doorman-service"
dynamic = ["version"]
description = "Access control service for Yale Doorman door locks with temporary codes"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Snippen", email = "admin@snippen.com" }
]
dependencies = [
    "packaging>=23.0",
]

[project.scripts]
snippen-doorman = "snippen_doorman.main:main_cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "packaging>=23.0",
    "build>=1.0.0",
]

[tool.setuptools.dynamic]
version = {attr = "snippen_doorman.__version__"}

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint.per-file-ignores]
"firmware/*" = ["FURB188"]
